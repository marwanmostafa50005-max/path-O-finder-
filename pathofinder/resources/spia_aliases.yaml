# Seed test-name normalisation map, following the RCPA SPIA (Standardised
# Pathology Informatics in Australia) preferred-term / LOINC reference sets.
# The clinician-editable local alias table (test_aliases, in-app editor)
# layers ON TOP of this seed and always wins on conflict.
#
# A raw name that matches nothing here or in test_aliases keeps its raw name
# and is marked for clinician review — never guessed.

version: 1
canonical:
  potassium:
    loinc: "2823-3"
    aliases: [potassium, "potassium level", "k", "k+", "serum potassium", "plasma potassium"]
  sodium:
    loinc: "2951-2"
    aliases: [sodium, "na", "na+", "serum sodium"]
