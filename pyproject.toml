[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathofinder"
version = "1.0.0"
description = "path-O-finder — air-gapped pathology-results safety net for Australian general practice"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Marwan Morsy" }]
dependencies = [
    "PySide6>=6.6",            # LGPL-3.0 (dynamically linked)
    "hl7apy>=1.3",             # MIT
    "hl7>=0.4",                # BSD-3-Clause (python-hl7 fallback tokeniser)
    "pdfplumber>=0.11",        # MIT
    "pypdfium2>=4.28",         # Apache-2.0 OR BSD-3-Clause
    "pytesseract>=0.3.10",     # Apache-2.0
    "Pillow>=10.0",            # MIT-CMU
    "APScheduler>=3.10",       # MIT
    "ruamel.yaml>=0.18",       # MIT
    "keyring>=24",             # MIT (Windows DPAPI-backed credential store)
]

[project.optional-dependencies]
sqlcipher = ["sqlcipher3-wheels>=0.5"]   # BSD; self-contained SQLCipher binary wheel
dev = [
    "pytest>=8",
    "pip-licenses>=4",
]

[project.gui-scripts]
pathofinder = "pathofinder.app:main"

[tool.setuptools.packages.find]
include = ["pathofinder*"]

[tool.setuptools.package-data]
pathofinder = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
